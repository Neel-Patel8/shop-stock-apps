<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Shop Stock Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span id="shopName">Shop Stock</span></div>
    <div class="topbar-right"><span id="syncState" class="sync" aria-live="polite">Connecting…</span></div>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" aria-label="Main">
    <a href="#scan" data-tab="scan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3M7 8v8M10 8v8M13 8v8M16 8v8"/></svg><span>Scan</span></a>
    <a href="#dashboard" data-tab="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Dashboard</span></a>
    <a href="#products" data-tab="products"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10"/></svg><span>Products</span></a>
    <a href="#alerts" data-tab="alerts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l10 18H2L12 3zM12 10v5M12 18v.5"/></svg><span>Alerts</span><b id="alertBadge" class="badge" hidden></b></a>
    <a href="#more" data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>More</span></a>
  </nav>
</div>
<div id="sheet" class="sheet" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="lib/papaparse.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="views.js"></script>
</body>
</html>
